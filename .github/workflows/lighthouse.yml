name: Lighthouse CI

# Runs on every PR + every push to main, plus manual dispatch as an escape
# hatch. ~1-2 min extra per PR; the static dist scores predictably so
# flake risk is low. Thresholds are in frontend/lighthouserc.json — if
# the site regresses below Perf 85 / A11y 90 / SEO 95 / BP 90, this fails.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: lighthouse (Perf / A11y / SEO / Best-Practices)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@^0.14
      - name: Run Lighthouse CI
        run: lhci autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7
